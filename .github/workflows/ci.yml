name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "1"
  # tmpfs /tmp is small on self-hosted runners; keep cargo/target caches on /mnt/data.
  BLVM_MESH_CACHE_ROOT: /mnt/data/runner-cache/blvm-mesh

jobs:
  setup:
    name: Setup
    runs-on: [self-hosted, Linux, X64, builds]
    if: |
      (github.event_name != 'push' || github.event.head_commit == null ||
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]')))
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-key }}
    steps:
      - name: Disk check
        uses: BTCDecoded/rust-ci/runner-disk-guard@main

      - uses: actions/checkout@v6

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - id: cache
        name: Cache key
        run: |
          DEPS_KEY=$(sha256sum Cargo.toml | cut -d' ' -f1)
          TOOLCHAIN=$(grep -E '^channel|rust-version' rust-toolchain.toml Cargo.toml 2>/dev/null | head -1 | sha256sum | cut -d' ' -f1 || echo "stable")
          CACHE_KEY="${DEPS_KEY}-${TOOLCHAIN}"
          echo "cache-key=$CACHE_KEY" >> "$GITHUB_OUTPUT"
          CACHE_ROOT="${BLVM_MESH_CACHE_ROOT}"
          mkdir -p "$CACHE_ROOT/cargo/$CACHE_KEY"/{registry,git} "$CACHE_ROOT/target/$CACHE_KEY"

  quality:
    name: Quality (fmt, clippy, test)
    needs: setup
    runs-on: [self-hosted, Linux, X64, builds]
    if: |
      (github.event_name != 'push' || github.event.head_commit == null ||
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]')))
    steps:
      - uses: actions/checkout@v6

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - name: Job-local HOME (Linux; avoid rustc ETXTBSY on shared rustup installs)
        run: |
          mkdir -p "${RUNNER_TEMP}/blvm-mesh-ci-home"
          echo "HOME=${RUNNER_TEMP}/blvm-mesh-ci-home" >> "$GITHUB_ENV"

      - name: Cache bind env (Linux self-hosted)
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}-quality
          cache-root: ${{ env.BLVM_MESH_CACHE_ROOT }}

      - name: Restore Cargo cache (Linux self-hosted)
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore
          cache-root: ${{ env.BLVM_MESH_CACHE_ROOT }}

      - name: Install Rust (Linux self-hosted)
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main
        with:
          components: rustfmt clippy

      - name: Regenerate lockfile for crates.io graph
        shell: bash
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets

      - name: test
        run: cargo test --workspace --all-targets

      - name: Save Cargo cache (Linux self-hosted)
        if: always()
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: save
          cache-root: ${{ env.BLVM_MESH_CACHE_ROOT }}

      - name: Prune old runner caches (Linux self-hosted)
        if: always()
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: prune
          cache-root: ${{ env.BLVM_MESH_CACHE_ROOT }}

  build:
    name: Build ${{ matrix.target }}
    needs: setup
    runs-on: ${{ matrix.runs_on }}
    if: |
      (github.event_name != 'push' || github.event.head_commit == null ||
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs_on: [self-hosted, Linux, X64, builds]
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            runs_on: [self-hosted, Linux, X64, builds]
            use_cross: true
          - target: x86_64-pc-windows-msvc
            runs_on: windows-2022
            use_cross: false

    steps:
      - uses: actions/checkout@v6

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - name: Job-local HOME (Linux; avoid rustc ETXTBSY on shared rustup installs)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "${RUNNER_TEMP}/blvm-mesh-ci-home"
          echo "HOME=${RUNNER_TEMP}/blvm-mesh-ci-home" >> "$GITHUB_ENV"

      - name: Cache bind env (Linux self-hosted)
        if: runner.os == 'Linux' && matrix.use_cross != true
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}-${{ matrix.target }}
          cache-root: ${{ env.BLVM_MESH_CACHE_ROOT }}

      - name: Restore Cargo cache (Linux self-hosted)
        if: runner.os == 'Linux' && matrix.use_cross != true
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore
          cache-root: ${{ env.BLVM_MESH_CACHE_ROOT }}

      - name: Isolate CARGO_HOME for cross (Linux)
        if: runner.os == 'Linux' && matrix.use_cross
        run: |
          CROSS_CARGO="${RUNNER_TEMP}/blvm-mesh-cross-cargo"
          rm -rf "$CROSS_CARGO"
          mkdir -p "$CROSS_CARGO"
          echo "CARGO_HOME=$CROSS_CARGO" >> "$GITHUB_ENV"

      - name: Install Rust (Linux self-hosted)
        if: runner.os == 'Linux'
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add Rust target (pinned toolchain)
        if: runner.os == 'Linux'
        run: rustup target add ${{ matrix.target }}

      # MSVC / Windows native builds.
      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Regenerate lockfile for crates.io graph
        shell: bash
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile

      - name: Install cross (aarch64 Linux)
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p blvm-mesh --bin blvm-mesh
          else
            cargo build --release --target ${{ matrix.target }} -p blvm-mesh --bin blvm-mesh
          fi

      # pwsh: Git Bash puts Git/usr/bin first, so `link.exe` is the wrong binary (MSVC vs GNU).
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release --target ${{ matrix.target }} -p blvm-mesh --bin blvm-mesh

      - name: Save Cargo cache (Linux self-hosted)
        if: always() && runner.os == 'Linux' && matrix.use_cross != true
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: save
          cache-root: ${{ env.BLVM_MESH_CACHE_ROOT }}

      - name: Prune old runner caches (Linux self-hosted)
        if: always() && runner.os == 'Linux'
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: prune
          cache-root: ${{ env.BLVM_MESH_CACHE_ROOT }}
