[workspace]
members = [
    ".",
    "modules/blvm-onion",
    "modules/blvm-mining-pool",
    "modules/blvm-messaging",
    "modules/blvm-bridge",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Bitcoin Commons Team"]
license = "MIT"
repository = "https://github.com/BTCDecoded/blvm-mesh"
homepage = "https://btcdecoded.org"

[workspace.dependencies]
# Shared dependencies across all workspace members
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
blvm-node = { version = ">=0.1, <1", features = ["sled"] }
blvm-sdk = { version = ">=0.1.13, <1", default-features = false, features = ["node"] }
blvm-sdk-macros = ">=0.1, <1"
blvm-protocol = ">=0.1, <1"
blvm-consensus = ">=0.1, <1"
clap = { version = "4.0", features = ["derive"] }
sha2 = "0.10"

[package]
name = "blvm-mesh"
version = "0.1.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

description = "Payment-gated mesh networking infrastructure for blvm-node"
keywords = ["bitcoin", "mesh", "networking", "routing", "module"]
categories = ["cryptography::cryptocurrencies", "network-programming"]

[lib]
name = "blvm_mesh"
path = "src/lib.rs"

[[bin]]
name = "blvm-mesh"
path = "bin/main.rs"

[dependencies]
# Workspace dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
blvm-node.workspace = true
blvm-sdk.workspace = true
blvm-sdk-macros.workspace = true
toml = "0.8"

# Mesh-specific dependencies
secp256k1 = { version = "0.28", features = ["rand"] }
sha2 = "0.10"
hex = "0.4"
bitcoin = "0.32"
lightning-invoice = { version = "0.32", features = ["std"] }
dashmap = "5.5"
lru = "0.12"
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4.0", features = ["derive"] }
futures = "0.3"
blvm-protocol.workspace = true
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[features]
default = []
# CTV (CheckTemplateVerify) payment proofs for mesh routing
ctv = ["blvm-protocol/ctv", "blvm-node/ctv"]

[dev-dependencies]
tokio-test = "0.4"
bitcoin_hashes = "0.3.2"
secp256k1 = { version = "0.28", features = ["recovery"] }

# Local monorepo: sibling paths override workspace dependency versions for all workspace members.
# Strip this section in CI/release (BTCDecoded/rust-ci/strip-patch-crates-io@main).
