name = "blvm-bridge"
version = "0.1.0"
description = "Bridge service for various connectivity types"
author = "Bitcoin Commons Team"
entry_point = "blvm-bridge"

capabilities = [
    "read_blockchain",
    "subscribe_events",
]

# CI/release fills url/sha256 (same platform keys as blvm-zmq) when this binary ships standalone.
[dependencies]
"blvm-mesh" = ">=0.1.0"
