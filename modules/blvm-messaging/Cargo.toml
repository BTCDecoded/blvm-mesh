[package]
name = "blvm-messaging"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

description = "P2P messaging via payment-gated mesh"
keywords = ["bitcoin", "mesh", "messaging", "p2p", "chat"]

[lib]
name = "blvm_messaging"
path = "src/lib.rs"

[[bin]]
name = "blvm-messaging"
path = "src/main.rs"

[dependencies]
# Core mesh infrastructure (path dependency within workspace)
blvm-mesh = { path = "../.." }

# Workspace dependencies
tokio.workspace = true
serde.workspace = true
bincode.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
blvm-node.workspace = true
blvm-sdk.workspace = true
blvm-sdk-macros.workspace = true
blvm-protocol.workspace = true
blvm-consensus.workspace = true

# Messaging-specific dependencies
chacha20poly1305 = "0.10"
hex = "0.4"
rand = "0.8"
sha2.workspace = true
