name = "blvm-messaging"
version = "0.1.0"
description = "P2P messaging via payment-gated mesh"
author = "Bitcoin Commons Team"
entry_point = "blvm-messaging"

capabilities = [
    "read_blockchain",
    "subscribe_events",
]

# CI/release fills url/sha256 (same platform keys as blvm-zmq) when this binary ships standalone.
[dependencies]
"blvm-mesh" = ">=0.1.0"
